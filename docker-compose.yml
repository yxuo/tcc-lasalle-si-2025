name: rotinar
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rotinar
      POSTGRES_USER: rotinar
      POSTGRES_PASSWORD: rotinar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotinar -d rotinar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: