name: rotinapp
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rotinapp
      POSTGRES_USER: rotinapp
      POSTGRES_PASSWORD: rotinapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotinapp -d rotinapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: