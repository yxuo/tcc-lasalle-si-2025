services:
  # 1. Frontend (Static Site)
  - type: web
    name: rotinapp-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rotinapp-api
          property: host

  # 2. Backend (Fastify API)
  - type: web
    name: rotinapp-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rotinapp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: rotinapp-web
          property: host

databases:
  # 3. PostgreSQL Database
  - name: rotinapp-db
    plan: free
