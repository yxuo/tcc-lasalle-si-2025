services:
  # Neon e Vercel sao configurados externamente nos respectivos paineis.
  - type: web
    name: rotinapp-api
    runtime: node
    buildCommand: npm install && npm run prisma:generate --workspace=@rotinapp/api && npm run prisma:migrate:deploy --workspace=@rotinapp/api && npm run build --workspace=@rotinapp/api
    startCommand: npm run start --workspace=@rotinapp/api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
